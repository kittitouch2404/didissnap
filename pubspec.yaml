name: didissnap
description: "Didissnap - OBD2 dashboard (ELM327 Bluetooth/WiFi + ESP32 CYD link)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  video_player: ^2.9.2
  image: ^4.2.0
  archive: '>=3.6.1 <5.0.0'
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/boot.mp4
    - assets/boot_8bit.m4a
    - assets/boot_whoosh.m4a
    - assets/boot_engine.m4a
  # ฟอนต์หน้า GIF (OFL / DSEG ใช้ฟรี ดู assets/fonts/*.txt)
  fonts:
    - family: RussoOne
      fonts: [{asset: assets/fonts/RussoOne-Regular.ttf}]
    - family: Audiowide
      fonts: [{asset: assets/fonts/Audiowide-Regular.ttf}]
    - family: Orbitron
      fonts: [{asset: assets/fonts/Orbitron-VF.ttf}]
    - family: Teko
      fonts: [{asset: assets/fonts/Teko-VF.ttf}]
    - family: BebasNeue
      fonts: [{asset: assets/fonts/BebasNeue-Regular.ttf}]
    - family: Rajdhani
      fonts: [{asset: assets/fonts/Rajdhani-Bold.ttf}]
    - family: BlackOpsOne
      fonts: [{asset: assets/fonts/BlackOpsOne-Regular.ttf}]
    - family: ShareTechMono
      fonts: [{asset: assets/fonts/ShareTechMono-Regular.ttf}]
    - family: Kanit
      fonts: [{asset: assets/fonts/Kanit-SemiBold.ttf}]
    - family: Michroma
      fonts: [{asset: assets/fonts/Michroma-Regular.ttf}]
    - family: Bungee
      fonts: [{asset: assets/fonts/Bungee-Regular.ttf}]
    - family: DSEG7
      fonts: [{asset: assets/fonts/DSEG7Classic-BoldItalic.ttf}]
